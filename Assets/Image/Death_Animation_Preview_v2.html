<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>사망 애니메이션 v2 · 30 프레임</title>
<style>body{margin:24px;background:#20252c;color:#eee;font-family:system-ui}h1{font-size:23px}p{color:#bdc8d4}button,select{padding:8px;margin:4px;font-size:15px}main{display:grid;grid-template-columns:repeat(2,minmax(300px,600px));gap:18px}canvas{width:100%;background:#e5ebf0;border-radius:10px}article h2{font-size:17px}.status{font-variant-numeric:tabular-nums;color:#9fd9ac}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<h1>인형·기사 사망 동작 · v2</h1>
<p>쓰러짐 12장 → 몸 고정 + 별 3개 시계방향 회전 18장 반복. 머리 흔들림 없음.</p>
<button id="replay">처음부터</button><button id="pause">일시 정지</button>
<label>확인 속도 <select id="speed"><option value="1">정상 속도</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label>
<p>그림 동작 확인용입니다. 게임의 히트스톱·4~5초 슬로모션·교대 로직은 포함하지 않습니다.</p>
<main id="grid"></main>
<script>
const entries=[['Doll_Death_Backward','인형 · 정면 피격 / 뒤로 쓰러짐'],['Doll_Death_Forward','인형 · 후면 피격 / 앞으로 쓰러짐'],['Knight_Death_Backward','기사 · 정면 피격 / 뒤로 쓰러짐'],['Knight_Death_Forward','기사 · 후면 피격 / 앞으로 쓰러짐']];
const tracks=entries.map(([name,label])=>{const article=document.createElement('article');const title=document.createElement('h2');title.textContent=label;const canvas=document.createElement('canvas');canvas.width=600;canvas.height=400;const status=document.createElement('p');status.className='status';article.append(title,canvas,status);document.querySelector('#grid').append(article);const image=new Image();image.src=name+'_30f_Sheet_v2.png';return{image,context:canvas.getContext('2d'),status}});
let clock=0,previous=performance.now(),paused=false;
document.querySelector('#replay').onclick=()=>{clock=0};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속 재생':'일시 정지'};
function tick(now){if(!paused)clock+=(now-previous)*Number(document.querySelector('#speed').value);previous=now;const step=Math.floor(clock/80);const frame=step<12?step:12+(step-12)%18;for(const track of tracks){const ctx=track.context;ctx.clearRect(0,0,600,400);if(track.image.complete&&track.image.naturalWidth)ctx.drawImage(track.image,(frame%6)*600,Math.floor(frame/6)*400,600,400,0,0,600,400);track.status.textContent=(step<12?'쓰러짐':'몸 고정 · 별 회전 반복')+' / 프레임 '+(frame+1)+' / 30'}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
